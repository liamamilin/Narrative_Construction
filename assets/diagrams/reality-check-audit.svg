<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="外部叙事审查与现实检验闭环">
  <rect width="960" height="280" rx="14" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="700">Part 4：外部叙事审查、命名权争夺与现实检验闭环（Ch 25–34）</text>

  <rect x="24" y="64" width="444" height="190" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="44" y="92" fill="#b91c1c" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="700">被动接受他人定义（外部剧本劫持）</text>
  <text x="44" y="124" fill="#1e293b" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">• 接受对方预设的“主体/处境/责任”框架</text>
  <text x="44" y="152" fill="#1e293b" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">• 只能在对方划定的二选一剧本里辩护或内耗</text>
  <text x="44" y="180" fill="#475569" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">• 脱离事实检验的自我催眠同样属于失真叙事</text>
  <text x="44" y="232" fill="#b91c1c" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="700">风险：丧失主体性或陷入脱离现实的空想</text>

  <rect x="492" y="64" width="444" height="190" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="512" y="92" fill="#047857" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" font-weight="700">主动叙事构造与现实检验（成为定义者）</text>
  <text x="512" y="124" fill="#1e293b" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">1. 剥离：把事实形态与他人的叙事包装拆开</text>
  <text x="512" y="152" fill="#1e293b" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">2. 定位：识别对方改写了 13 个容器中的哪一个</text>
  <text x="512" y="180" fill="#1e293b" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">3. 重构：提出更贴合事实且打开行动空间的新定义</text>
  <text x="512" y="208" fill="#1e293b" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">4. 检验：用行动反馈修正定义，沉淀个人与共同体话语</text>
  <text x="512" y="232" fill="#047857" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" font-weight="700">判准：贴合事实边界 + 扩大主体有效行动空间</text>
</svg>
