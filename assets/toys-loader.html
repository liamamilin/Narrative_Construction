<script>
  (function () {
    function boot() {
      if (window.NarrativeToys && typeof window.NarrativeToys.mountAll === 'function') {
        window.NarrativeToys.mountAll(document);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
</script>
